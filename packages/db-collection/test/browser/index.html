<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>nizhal client-group cross-tab harness</title>
  </head>
  <body>
    <h1 id="tab">tab</h1>
    <pre id="state"></pre>
    <script type="module" src="/harness.js"></script>
    <script>
      const tab = new URLSearchParams(location.search).get("tab") ?? "?";
      document.getElementById("tab").textContent = "tab " + tab;
      setInterval(() => {
        if (!window.__cgReady) return;
        document.getElementById("state").textContent = JSON.stringify(
          { leader: window.cgIsLeader(), applied: window.cgApplied() },
          null,
          2,
        );
      }, 200);
    </script>
  </body>
</html>
